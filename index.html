<!DOCTYPE html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PP Catalogue">
<meta name="theme-color" content="#221710">
<meta name="googlebot" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PP Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#221710; --navy2:#2d1f15; --card:#362619; --line:#4d3826;
  --gold:#b08d57; --gold2:#d8bc8a; --txt:#f0e8da; --dim:#a89680;
  --green:#8fb573; --red:#c96a5e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--navy);color:var(--txt);font-family:'Outfit',sans-serif;min-height:100vh;padding-bottom:60px}

header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--navy) 70%,rgba(34,23,16,.94));backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
h1{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;min-width:0}
h1 span{color:var(--gold2)}
h1 img{width:26px;height:26px;border-radius:50%;background:#fff;padding:2px}
.src.dis{font-size:7px;opacity:.4;letter-spacing:0;max-width:none;line-height:1.2}
h1 .mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#b08d3f;color:#12182b;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;margin-right:6px;vertical-align:middle}
#lastSync{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim)}
#chfBox{display:none;margin-top:10px;background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:12px}
#chfBox.on{display:block}
.chfTitle{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
#chfText{width:100%;height:78px;background:var(--navy);border:1px solid var(--line);border-radius:9px;color:var(--txt);font-family:'DM Mono',monospace;font-size:11px;padding:9px;outline:none;resize:vertical}
.chfBtns{display:flex;gap:7px;margin-top:9px}
.chfInfo{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-top:8px}
@media (max-width:430px){h1{font-size:15px;letter-spacing:.04em}h1 .mark{width:22px;height:22px;font-size:9px;margin-right:2px}#lastSync{font-size:9px}}

.toolbar{display:flex;gap:8px;margin-top:12px}
.toolbar input{flex:1;background:var(--navy2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;padding:9px 12px;outline:none}
.toolbar input:focus{border-color:var(--gold)}
button{cursor:pointer;border:none;font-family:'Outfit',sans-serif}
.btn{background:var(--navy2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.gold{background:var(--gold);color:#14233f;border-color:var(--gold);font-weight:600}

.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--navy2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:500}
.chip b{color:var(--txt);font-weight:600}
.chip.active{background:var(--gold);border-color:var(--gold);color:#14233f}
.chip.active b{color:#14233f}

#status{padding:10px 16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--dim)}
#status .hl{color:var(--gold2)}

#newsbar{display:none;margin:0 16px 4px;padding:12px 14px;background:linear-gradient(135deg,#2e2a14,#362619);border:1px solid var(--gold);border-radius:12px}
#newsbar.show{display:block}
#newsbar h3{font-size:13px;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
#newsbar p{font-size:12.5px;color:var(--dim);line-height:1.5}
#newsbar p b{color:var(--txt)}

main{padding:8px 16px}
.brand-section{margin-top:22px}
.brand-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px}
.brand-head h2{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.brand-head .cnt{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{position:relative;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s}
.card:active{border-color:var(--gold)}
.thumb{width:100%;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .noimg{font-family:'DM Mono',monospace;font-size:10px;color:#999}
.thumb{cursor:zoom-in}
#sheetOverlay{display:none;position:fixed;inset:0;background:rgba(20,13,8,.65);z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 10px calc(24px + env(safe-area-inset-bottom))}
#sheetOverlay.open{display:block}
body.sheet-open{overflow:hidden}
@supports (-webkit-touch-callout:none){body.sheet-open #sheetOverlay{position:fixed;height:100dvh}}
.sheet{background:#fff;color:#1a2238;max-width:640px;margin:0 auto;border-radius:16px;padding:26px 20px 0;text-align:center;position:relative}
.sheet .brand{margin-bottom:2px}
.sheet .pplogo{display:block;height:34px;width:auto;margin:0 auto 6px;object-fit:contain}
.sheet .ppword{font-family:Georgia,'Times New Roman',serif;font-size:15px;letter-spacing:5px;text-transform:uppercase;color:#1a2238}
.sheet h1{font-weight:300;font-size:28px;margin:6px 0 2px;color:#1a2238}
.sheet .scol{font-size:13px;color:#666;margin-bottom:20px}
.sheet .photo{max-width:75%;max-height:44vh;object-fit:contain;margin:0 auto 22px;display:block}
.sheet .smat{font-size:13px;line-height:1.6;max-width:480px;margin:0 auto 6px;color:#333}
.sheet .sdesc{font-size:12.5px;line-height:1.6;max-width:500px;margin:0 auto 16px;color:#333;text-align:left}
.sheet .tc{margin:0 0 9px}
.sheet .tct{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#b08d3f;margin-bottom:2px}
.sheet .spr{font-family:'DM Mono',monospace;font-size:16px;color:#b08d3f;margin:3px 0}
.sheet .sprices .price{font-family:'DM Mono',monospace;font-size:16px;color:#b08d3f;margin:3px 0}
.sheet .sprices .price.wait{color:#bbb;font-size:13px}
.sheet .spr span{font-size:10px;color:#999}
.sheet .ssrc{margin-top:26px;font-family:'DM Mono',monospace;font-size:9px;color:#aaa}
.sheet-btns{position:sticky;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 0 16px;margin-top:14px;background:linear-gradient(rgba(255,255,255,0),#fff 28%)}
.sheet-btns button{border:0;border-radius:9px;padding:11px 22px;font-family:Outfit,sans-serif;font-size:14px;cursor:pointer}
.sheet-btns .bprint{background:#1a2238;color:#fff}
.sheet-btns .bclose{background:#eee;color:#1a2238}
@media print{
  @page{margin:10mm}
  html,body{background:#fff!important;-webkit-print-color-adjust:economy;print-color-adjust:economy}
  body.sheet-open > *:not(#sheetOverlay){display:none!important}
  #sheetOverlay{position:static!important;inset:auto;background:#fff!important;padding:0!important;margin:0;overflow:visible;height:auto;width:auto;backdrop-filter:none}
  .sheet{background:#fff!important;border-radius:0;max-width:none!important;width:auto!important;margin:0;padding:0;box-shadow:none;page-break-inside:avoid}
  .sheet .pplogo{height:26px;margin-bottom:4px}
  .sheet .ppword{font-size:12px;letter-spacing:4px}
  .sheet h1{font-size:22px;margin:4px 0 1px}
  .sheet .scol{font-size:11px;margin-bottom:10px}
  .sheet .photo{max-width:52%;max-height:78mm;margin:0 auto 10px}
  .sheet .smat{font-size:10.5px;margin-bottom:4px}
  .sheet .sdesc{font-size:10px;line-height:1.35;max-width:none;margin-bottom:8px}
  .sheet .tc{margin-bottom:5px}
  .sheet .tct{font-size:8px;letter-spacing:1.4px}
  .sheet .sprices .price{font-size:13px;margin:1px 0}
  .sheet .ssrc{margin-top:10px;font-size:8px}
  .sheet-btns{display:none!important}
}
.card .ref{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color .15s}
.card .ref:hover{text-decoration-color:currentColor}
.meta{padding:9px 10px 11px}
.meta .ref{font-family:'DM Mono',monospace;font-size:14px;color:var(--gold2)}
.meta .mat{font-size:12px;color:var(--txt);margin-top:4px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .col{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.meta .price{font-family:'DM Mono',monospace;font-size:14px;color:var(--gold2);margin-top:6px}
.meta .price.est{font-size:10.5px;color:var(--dim);margin-top:2px}
.meta .prices{margin-top:6px}
.meta .prices .price{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--gold2);margin:1px 0;letter-spacing:.02em}
.meta .prices .price.wait{color:var(--dim);opacity:.45}
.badge{position:absolute;top:8px;left:8px;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.08em;padding:3px 8px;border-radius:6px;z-index:2;background:var(--green);color:#0a1428}

#empty{display:none;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px}
#loader{display:none;flex-direction:column;align-items:center;gap:16px;padding:70px 20px}
#loader.on{display:flex}
.spin{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--gold),rgba(176,141,63,.05) 70%);animation:sp 1.05s linear infinite;position:relative}
.spin::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
#loadPhase{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.28em;text-transform:uppercase}
#loadCount{display:flex;gap:26px;justify-content:center}
#loadCount div{text-align:center}
#loadCount b{display:block;font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--gold2);line-height:1.15;font-variant-numeric:tabular-nums}
#loadCount span{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

footer{position:fixed;bottom:0;left:0;right:0;padding:4px 12px calc(4px + env(safe-area-inset-bottom));background:rgba(34,23,16,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
footer .src{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--dim);text-align:center;line-height:1.25}
footer .src a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="brandline">
    <h1><span class="mark">PP</span>Patek Philippe <span>Catalogue</span></h1>
    <div id="lastSync">—</div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Cerca referenza, materiale…" autocomplete="off">
    <button class="btn gold" id="btnRefresh">Aggiorna</button>
    <button class="btn" id="btnChf" title="Incolla il listino svizzero">CHF</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="chfBox">
    <div class="chfTitle">Listino svizzero</div>
    <textarea id="chfText" placeholder='Incolla qui il listino raccolto da patek.com'></textarea>
    <div class="chfBtns">
      <button class="btn gold" id="chfSave">Importa</button>
      <button class="btn" id="chfClear">Svuota</button>
      <button class="btn" id="chfClose">Chiudi</button>
    </div>
    <div class="chfInfo" id="chfInfo"></div>
  </div>
</header>

<div id="status"></div>

<div id="newsbar">
  <h3>Novità a catalogo</h3>
  <p id="newsTxt"></p>
</div>

<div id="loader">
  <span class="spin"></span>
  <div id="loadPhase">Connessione al catalogo</div>
  <div id="loadCount">
    <div><b id="cModels">0</b><span>modelli</span></div>
    <div><b id="cCols">0</b><span>collezioni</span></div>
  </div>
</div>
<main id="main"></main>
<div id="empty">Nessun risultato con questi filtri.</div>

<footer>
  <div class="src">patek.com · listino EU gen 2026 (€) · novità W&amp;W in CHF</div>
  <div class="src dis">Strumento privato non ufficiale · marchi e contenuti Patek Philippe SA · nessuna affiliazione</div>
</footer>

<script>
(() => {
const FINDER = 'https://www.patek.com/en/collection/watch-finder';
const SNAP_KEY = 'pp_snapshot_v1';
const CAT_KEY = 'pp_catalog_v1';
const CAT_TTL = 24 * 60 * 60 * 1000;

const COLLECTIONS = {
  'grand-complications':'Grand Complications',
  'complications':'Complications',
  'calatrava':'Calatrava',
  'gondolo':'Gondolo',
  'golden-ellipse':'Golden Ellipse',
  'cubitus':'Cubitus',
  'nautilus':'Nautilus',
  'aquanaut':'Aquanaut',
  'twenty4':'Twenty~4',
  'pocket-watches':'Pocket Watches',
  'rare-handcrafts':'Rare Handcrafts'
};

const RETAIL = {
  '5810/1G-001':[75000,'CHF'],
  '5810G-001':[60000,'CHF'],
  '5610/1P-001':[90000,'CHF'],
  '958G-001':[205000,'CHF'],
  '6105G-001':[350000,'CHF'],
  '5840P-001':[150000,'CHF'],
  '5249R-001':[320000,'CHF'],
  '7047G-001':[445000,'CHF'],
  '5322G-001':[225000,'CHF'],
  '5322G-010':[225000,'CHF'],
  '5738G-001':[34400,'CHF'],
  '3738/100G-014':[32400,'CHF']
};

let items = [];
let snapshot = null;
let added = [];
const PROXY = 'https://watch-proxy.owscan.workers.dev/?u=';
function imgFail(el){
  if(el.dataset.orig){
    const o = el.dataset.orig;
    delete el.dataset.orig;
    el.src = 'https://wsrv.nl/?url=' + encodeURIComponent(o.replace(/^https?:\/\//,'')) + '&w=440&output=webp';
  }else{
    el.parentNode.innerHTML = '<span class="noimg">NO IMG</span>';
  }
}
function bigURL(u){
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(u.replace(/^https?:\/\//,'')) + '&w=1100&output=webp&q=88';
}
function thumbURL(u){
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(u.replace(/^https?:\/\//,'')) + '&w=440&h=440&fit=contain&output=webp&q=72';
}
let activeCol = 'ALL';

// ---------- listini ufficiali per mercato ----------
// patek.com serve il prezzo nella valuta del paese da cui arriva la richiesta:
// niente conversioni, si interroga il sito da tre uscite diverse.
const PRICE_KEY = 'pp_price_v6', ROUTE_KEY = 'pp_routes_v2';
const PRICE_TTL = 7 * 24 * 60 * 60 * 1000;
const ROUTE_TTL = 7 * 24 * 60 * 60 * 1000;
let priceCache = (() => { try{ const r = localStorage.getItem(PRICE_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } })();
let routeMap = (() => { try{ const r = localStorage.getItem(ROUTE_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } })();
const pricePending = new Set();
function savePrices(){ try{ localStorage.setItem(PRICE_KEY, JSON.stringify(priceCache)); }catch(e){} }

// uscite disponibili: la prima e' il tuo Worker, le altre servono solo a cambiare paese di provenienza
const ROUTES = [
  u => PROXY + encodeURIComponent(u)
];
// lettore con uscita a Francoforte: patek.com gli serve il listino in euro
const EU_API = 'https://pp-eu-probe.vercel.app/api/price?u=';
// L'uscita e' a Francoforte, quindi patek.com serve il prezzo con IVA tedesca (19%).
// Patek fissa un netto europeo unico: si toglie l'IVA tedesca e si applica quella italiana (22%).
const VAT_DE = 0.19, VAT_IT = 0.22;
function deToIt(v){ return Math.round(v / (1 + VAT_DE) * (1 + VAT_IT)); }
async function eurOf(url){
  const r = await fetch(EU_API + encodeURIComponent(url), {cache:'no-store'});
  if(!r.ok) throw new Error('eu ' + r.status);
  const d = await r.json();
  if(d && d.ok && d.valuta === 'EUR' && d.prezzo) return deToIt(d.prezzo);
  return null;
}
function cleanNum(s){
  let x = s.replace(/[\u2019'\u00a0\s]/g, '');
  x = x.replace(/[.,](\d{2})$/, '');
  return +x.replace(/[^0-9]/g, '');
}
function parsePrice(raw){
  const t = String(raw)
    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;|&#160;/gi, ' ')
    .replace(/&euro;/gi, '\u20AC')
    .replace(/&#8217;|&rsquo;/gi, '\u2019')
    .replace(/\s+/g, ' ');
  const tries = [
    [/(?:CHF|SFr\.?)\s?([\d][\d\u2019'.,\s]{3,})/i, 'CHF'],
    [/([\d][\d\u2019'.,\s]{3,})\s?(?:CHF|SFr\.?)/i, 'CHF'],
    [/\u20AC\s?([\d][\d.,\s]{3,})/, 'EUR'],
    [/([\d][\d.,\s]{3,})\s?\u20AC/, 'EUR'],
    [/\$\s?([\d][\d,]{3,})/, 'USD']
  ];
  for(const [re, cur] of tries){
    const m = t.match(re);
    if(m){
      const v = cleanNum(m[1]);
      if(v > 1000 && v < 100000000) return {v, cur};
    }
  }
  return null;
}
function priceOf(ref){
  const c = priceCache[ref];
  return (c && Date.now() - c.ts < PRICE_TTL) ? c : null;
}
async function viaRoute(i, url){
  const r = await fetch(ROUTES[i](url), {cache:'no-store'});
  if(!r.ok) throw new Error('route ' + i);
  return parsePrice(await r.text());
}
// sonda: scopre quale uscita restituisce quale valuta ufficiale
let probing = null;
async function probeRoutes(sampleUrl){
  if(routeMap && Date.now() - routeMap.ts < ROUTE_TTL) return routeMap;
  if(probing) return probing;
  probing = (async () => {
  const map = {};
  for(let i = 0; i < ROUTES.length; i++){
    try{
      const p = await viaRoute(i, sampleUrl);
      if(p && map[p.cur] == null) map[p.cur] = i;
    }catch(e){}
  }
    routeMap = {map, ts: Date.now()};
    try{ localStorage.setItem(ROUTE_KEY, JSON.stringify(routeMap)); }catch(e){}
    return routeMap;
  })();
  try{ return await probing; } finally { probing = null; }
}
// prezzo dalla tua uscita: e' quello che vedresti tu aprendo patek.com
async function loadPrice(ref, url){
  if(pricePending.has(ref)) return;
  const cached = priceOf(ref);
  if(cached && cached.EUR != null) return;      // gia' completo
  pricePending.add(ref);
  try{
    if(cached) throw new Error('salta usd');     // dollaro gia' noto: vai diritto all'euro
    const p = await viaRoute(0, url);
    if(p){
      const rec = priceCache[ref] && Date.now() - priceCache[ref].ts < PRICE_TTL ? priceCache[ref] : {ts: Date.now()};
      rec[p.cur] = p.v;
      rec.ts = Date.now();
      const rt = RETAIL[ref];
      if(rt && rec[rt[1]] == null) rec[rt[1]] = rt[0];
      priceCache[ref] = rec;
      savePrices();
      refreshPrices(ref);
    }
  }catch(e){}
  // listino europeo ufficiale
  try{
    const rec = priceCache[ref] || {ts: Date.now()};
    if(rec.EUR == null){
      const e = await eurOf(url);
      if(e){
        rec.EUR = e;
        rec.ts = Date.now();
        priceCache[ref] = rec;
        savePrices();
        refreshPrices(ref);
      }
    }
  }catch(e){}
  finally{ pricePending.delete(ref); }
}
// listini mancanti, interrogando patek.com dalle altre uscite
async function loadAllMarkets(ref, url, onUpdate){
  await probeRoutes(url);
  const map = (routeMap && routeMap.map) || {};
  for(const cur of ['CHF','EUR','USD']){
    const rec = priceCache[ref] || {ts: Date.now()};
    if(rec[cur] != null) continue;
    const i = map[cur];
    if(i == null) continue;
    try{
      const p = await viaRoute(i, url);
      if(p && p.cur === cur){
        rec[cur] = p.v;
        rec.ts = Date.now();
        priceCache[ref] = rec;
        savePrices();
        if(onUpdate) onUpdate();
      }
    }catch(e){}
  }
}
function fmt(cur, v){
  const n = Math.round(v).toLocaleString('it-IT');
  return cur === 'USD' ? '$ ' + n : (cur === 'EUR' ? '\u20AC ' + n : 'CHF ' + n);
}
// solo listini ufficiali: mai valori convertiti
// listino svizzero importato dal browser (raccolto su patek.com dalla Svizzera)
const CHF_KEY = 'pp_chf_v1', CHF_REPO_KEY = 'pp_chf_repo_v1';
let chfList = (() => { try{ const r = localStorage.getItem(CHF_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } })();
// listino ufficiale svizzero pubblicato nel repository: unica fonte per tutti i dispositivi
let chfRepo = (() => { try{ const r = localStorage.getItem(CHF_REPO_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } })();
let chfRepoInfo = null;
async function loadChfRepo(){
  try{
    const r = await fetch('chf.json?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const d = await r.json();
    const p = (d && d.prezzi) ? d.prezzi : d;
    if(p && typeof p === 'object' && !Array.isArray(p)){
      const clean = {};
      for(const k of Object.keys(p)){
        const v = +p[k];
        if(v > 1000 && v < 100000000) clean[String(k).toUpperCase()] = Math.round(v);
      }
      if(Object.keys(clean).length){
        chfRepo = clean;
        chfRepoInfo = (d && d.aggiornato) ? d.aggiornato : null;
        try{ localStorage.setItem(CHF_REPO_KEY, JSON.stringify(chfRepo)); }catch(e){}
        render();
        chfInfo();
      }
    }
  }catch(e){}
}
function chfOf(ref){
  if(chfRepo[ref] != null) return chfRepo[ref];
  if(chfList[ref] != null) return chfList[ref];
  return null;
}
function chfCount(){ return Object.keys(chfList).length; }
function chfInfo(){
  const el = document.getElementById('chfInfo');
  if(!el) return;
  const nr = Object.keys(chfRepo).length, nl = chfCount();
  const parts = [];
  if(nr) parts.push(nr + ' dal listino pubblicato' + (chfRepoInfo ? ' (' + chfRepoInfo + ')' : ''));
  if(nl) parts.push(nl + ' importate su questo dispositivo');
  el.textContent = parts.length ? parts.join(' \u00B7 ') : 'nessun listino in franchi';
}
function chfImport(txt){
  let d;
  try{ d = JSON.parse(txt); }catch(e){ return {ok:false, msg:'testo non valido: incolla il listino cosi\u2019 com\u2019e\u0300'}; }
  if(!d || typeof d !== 'object' || Array.isArray(d)) return {ok:false, msg:'formato non riconosciuto'};
  let n = 0;
  for(const k of Object.keys(d)){
    const v = +d[k];
    if(v > 1000 && v < 100000000){ chfList[String(k).toUpperCase()] = Math.round(v); n++; }
  }
  try{ localStorage.setItem(CHF_KEY, JSON.stringify(chfList)); }catch(e){}
  return {ok:true, msg: n + ' prezzi importati'};
}
function priceRows(ref){
  const rec = Object.assign({}, priceOf(ref) || {});
  const rt = RETAIL[ref];
  if(rt && rec[rt[1]] == null) rec[rt[1]] = rt[0];
  const c = chfOf(ref);
  if(c != null) rec.CHF = c;
  let out = '';
  let any = false;
  for(const cur of ['CHF','EUR','USD']){
    if(rec[cur] != null){ out += '<div class="price">' + fmt(cur, rec[cur]) + '</div>'; any = true; }
  }
  return any ? out : '<div class="price"><span style="opacity:.4">\u2026</span></div>';
}
// coda: al massimo tre letture in parallelo, cosi' le card si popolano senza intasare la rete
const pq = [];
let pqRunning = 0;
function pqPush(fn){
  pq.push(fn);
  pqNext();
}
function pqNext(){
  while(pqRunning < 3 && pq.length){
    const fn = pq.shift();
    pqRunning++;
    Promise.resolve().then(fn).catch(() => {}).finally(() => { pqRunning--; pqNext(); });
  }
}
function refreshPrices(ref){
  document.querySelectorAll('[data-pp="'+CSS.escape(ref)+'"]').forEach(el => { el.innerHTML = priceRows(ref); });
}
// carica i tre listini per una card
async function loadCard(ref, url){
  const need = () => {
    const rec = priceOf(ref) || {};
    return ['CHF','EUR','USD'].some(c => rec[c] == null);
  };
  if(!need()) return;
  await loadPrice(ref, url);
  refreshPrices(ref);
}
function usdOf(ref){
  const rec = priceOf(ref);
  return rec && rec.USD != null ? rec.USD : null;
}
const priceObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  for(const en of entries){
    if(en.isIntersecting){
      const el = en.target;
      priceObserver.unobserve(el);
      pqPush(() => loadCard(el.dataset.ref, el.dataset.purl));
    }
  }
}, {rootMargin: '200px'}) : null;

let memStore = {};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] || null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){ memStore[k] = v; } }

// ---------- fetch HTML con fallback proxy ----------
async function getHTML(url){
  const routes = [
    u => PROXY + encodeURIComponent(u),
    u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
  ];
  let lastErr = null;
  for(const route of routes){
    try{
      const r = await fetch(route(url), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      if(html && html.length > 5000 && /collection/i.test(html)) return html;
      throw new Error('Risposta non valida');
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Nessuna via di accesso disponibile');
}

// ---------- parsing ----------
function slugToRef(slug){
  const s = slug.toUpperCase().split('-');
  if(s.length >= 3) return s[0] + '/' + s[1] + '-' + s.slice(2).join('-');
  return s.join('-');
}
function parseCatalog(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const seen = new Set();
  const out = [];
  doc.querySelectorAll('a[href*="/collection/"]').forEach(a => {
    const href = a.getAttribute('href') || '';
    const m = href.match(/\/collection\/([a-z0-9-]+)\/([a-z0-9-]+)\/?$/i);
    if(!m) return;
    const colSlug = m[1].toLowerCase();
    if(!COLLECTIONS[colSlug]) return;               // esclude link di navigazione
    if(/all-watches|all-models/.test(m[2])) return;
    const slug = m[2].toLowerCase();
    const id = colSlug + '/' + slug;
    if(seen.has(id)) return;
    seen.add(id);

    const ref = slugToRef(slug);
    const colLabel = COLLECTIONS[colSlug];

    // materiale/nome: testo dell'anchor dopo referenza e collezione
    let mat = '';
    const t = (a.textContent || '').replace(/\s+/g, ' ').trim();
    const ri = t.indexOf(ref);
    if(ri !== -1){
      let rest = t.slice(ri + ref.length);
      const ci = rest.indexOf(colLabel);
      if(ci !== -1) rest = rest.slice(ci + colLabel.length);
      mat = rest.trim();
    }

    // immagine: img dentro l'anchor (anche lazy)
    let img = null;
    const im = a.querySelector('img');
    if(im) img = im.getAttribute('src') || im.getAttribute('data-src') || (im.getAttribute('srcset')||'').split(' ')[0] || null;
    if(img && img.startsWith('/')) img = 'https://www.patek.com' + img;

    out.push({
      id, ref, col: colLabel, mat,
      url: href.startsWith('http') ? href : 'https://www.patek.com' + href,
      img
    });
  });
  return out;
}

// ---------- novità ----------
function computeAdded(){
  added = [];
  if(!snapshot) return;
  for(const p of items){
    if(!snapshot.ids.includes(p.id)) added.push(p.id);
  }
}
function renderNews(){
  const bar = document.getElementById('newsbar');
  if(!snapshot || !added.length){ bar.classList.remove('show'); return; }
  const names = items.filter(p => added.includes(p.id)).slice(0,6).map(p => esc(p.ref));
  document.getElementById('newsTxt').innerHTML =
    '<b>' + added.length + ' nuove referenze</b> dall\'ultima visita (' +
    new Date(snapshot.ts).toLocaleDateString('it-IT') + '): ' + names.join(' · ') +
    (added.length > 6 ? ' …' : '');
  bar.classList.add('show');
}

// ---------- render ----------
function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';

  const byCol = {};
  for(const p of items) (byCol[p.col] = byCol[p.col] || []).push(p);
  const cols = Object.values(COLLECTIONS).filter(c => byCol[c]);

  renderChips(cols, byCol);

  let shown = 0;
  for(const c of cols){
    if(activeCol !== 'ALL' && c !== activeCol) continue;
    let list = byCol[c];
    if(q) list = list.filter(p => (p.ref + ' ' + p.mat + ' ' + p.col).toLowerCase().includes(q));
    if(!list.length) continue;

    const sec = document.createElement('section');
    sec.className = 'brand-section';
    sec.innerHTML = '<div class="brand-head"><h2>'+esc(c)+'</h2><span class="cnt">'+list.length+' modelli</span></div>';
    const grid = document.createElement('div');
    grid.className = 'grid';

    for(const p of list){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        (added.includes(p.id) ? '<span class="badge">NEW</span>' : '') +
        '<div class="thumb">' + (p.img ? '<img loading="lazy" decoding="async" src="'+esc(thumbURL(p.img))+'" data-orig="'+esc(p.img)+'" alt="" onerror="imgFail(this)">' : '<span class="noimg">NO IMG</span>') + '</div>' +
        '<div class="meta"><div class="ref">'+esc(p.ref)+'</div>' +
        '<div class="mat">'+esc(p.mat || '')+'</div>' +
        retailLine(p.ref) +
        '<div class="col">'+esc(p.col)+'</div></div>';
      const th = card.querySelector('.thumb');
      if(th) th.addEventListener('click', () => openSheet(p));
      const rf = card.querySelector('.ref');
      if(rf) rf.addEventListener('click', () => window.open(p.url, '_blank', 'noopener'));
      grid.appendChild(card);
      const priceEl = card.querySelector('[data-pp]');
      const recNow = priceOf(p.ref) || {};
      const missing = ['CHF','EUR','USD'].some(c => recNow[c] == null);
      if(priceEl && priceObserver && missing){
        priceEl.dataset.ref = p.ref;
        priceEl.dataset.purl = p.url;
        priceObserver.observe(priceEl);
      }
      shown++;
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
}

function renderChips(cols, byCol){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  const mk = (label, key, count) => {
    const c = document.createElement('button');
    c.className = 'chip' + (activeCol === key ? ' active' : '');
    c.innerHTML = esc(label) + (count != null ? ' <b>'+count+'</b>' : '');
    c.onclick = () => { activeCol = key; render(); };
    box.appendChild(c);
  };
  mk('Tutte', 'ALL', items.length);
  for(const c of cols) mk(c, c, byCol[c].length);
}

let descCache = (() => { try{ const r = localStorage.getItem('pp_desc_v3'); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } })();
function saveDesc(){ try{ localStorage.setItem('pp_desc_v3', JSON.stringify(descCache)); }catch(e){} }
// Estrae le sezioni di "Technical characteristics" lavorando sul testo grezzo
const TECH_LABELS = ['dial','case','bezel','bracelet','strap','buckle','clasp','movement','caliber','calibre','additional information','chain'];
function decodeEnt(s){
  const ta = document.createElement('textarea');
  ta.innerHTML = s;
  return ta.value;
}
function parseTech(raw){
  let h = raw.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
  const m = h.search(/technical\s*characteristics/i);
  if(m === -1) return null;
  let seg = h.slice(m);
  const stop = seg.search(/instructions\s+for\s+use|other\s+models|similar\s+watches|explore\s+more|jewelry\s*&amp;\s*accessories/i);
  if(stop > 40) seg = seg.slice(0, stop);
  seg = seg.slice(0, 40000);
  // tag di blocco -> a capo, il resto via
  seg = seg.replace(/<\s*(br|\/p|\/div|\/li|\/h[1-6]|\/span|\/td|\/tr|\/button|\/section)[^>]*>/gi, '\n')
           .replace(/<[^>]+>/g, ' ');
  const lines = decodeEnt(seg).split('\n')
    .map(x => x.replace(/\s+/g, ' ').trim())
    .filter(x => x && !/^technical\s*characteristics$/i.test(x));
  const secs = [];
  let cur = null;
  for(const ln of lines){
    const key = ln.replace(/[:\u2013\u2014-]\s*$/, '').toLowerCase();
    if(ln.length <= 26 && TECH_LABELS.includes(key)){
      cur = {t: ln.replace(/[:\u2013\u2014-]\s*$/, ''), b: ''};
      secs.push(cur);
      continue;
    }
    if(cur && ln.length > 1 && !/^(front|back|download|play video|reduce motion)$/i.test(ln)){
      if(cur.b.length < 600) cur.b += (cur.b ? ' ' : '') + ln;
    }
  }
  const out = secs.filter(s => s.b.length > 3);
  return out.length ? out.slice(0, 6) : null;
}
let ppLogo = (() => { try{ return localStorage.getItem('pp_logo_v1') || null; }catch(e){ return null; } })();
function findLogo(raw){
  const cands = [];
  const re = /(?:src|href|content)\s*=\s*["']([^"']+\.(?:svg|png))["']/gi;
  let m;
  while((m = re.exec(raw))){
    const u = m[1];
    if(/logo|calatrava|brand/i.test(u) && !/facebook|instagram|twitter|apple|google/i.test(u)) cands.push(u);
  }
  if(!cands.length) return null;
  let u = cands.sort((a, b) => (/\.svg$/i.test(b) ? 1 : 0) - (/\.svg$/i.test(a) ? 1 : 0))[0];
  if(u.startsWith('//')) u = 'https:' + u;
  else if(u.startsWith('/')) u = 'https://www.patek.com' + u;
  else if(!/^https?:/i.test(u)) u = 'https://www.patek.com/' + u;
  return u;
}
function logoIMG(){
  if(!ppLogo) return '';
  const via = 'https://images.weserv.nl/?url=' + encodeURIComponent(ppLogo.replace(/^https?:\/\//,'')) + '&w=420&output=png';
  return '<img class="pplogo" src="' + esc(via) + '" alt="" onerror="this.style.display=\'none\'">';
}
async function fetchDesc(p){
  const c = descCache[p.ref];
  if(c && Date.now() - c.ts < PRICE_TTL) return c.v;
  try{
    const r = await fetch(PROXY + encodeURIComponent(p.url), {cache:'no-store'});
    const t = await r.text();
    if(!ppLogo){
      const lg = findLogo(t);
      if(lg){ ppLogo = lg; try{ localStorage.setItem('pp_logo_v1', lg); }catch(e){}
        const h = document.getElementById('sheetHead'); if(h) h.innerHTML = logoIMG() + '<div class="ppword">Patek Philippe</div>'; }
    }
    const secs = parseTech(t);
    if(secs){ descCache[p.ref] = {v: secs, ts: Date.now()}; saveDesc(); return secs; }
  }catch(e){}
  return null;
}
function descHTML(secs){
  return secs.map(s => '<div class="tc"><span class="tct">' + esc(s.t) + '</span>' + esc(s.b) + '</div>').join('');
}
window.closeSheet = closeSheet;
function closeSheet(){
  const o = document.getElementById('sheetOverlay');
  if(o) o.classList.remove('open');
  document.body.classList.remove('sheet-open');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
function ensureSheet(){
  let ov = document.getElementById('sheetOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'sheetOverlay';
    ov.innerHTML = '<div class="sheet" id="sheetBox"></div>';
    document.body.appendChild(ov);
  }
  return ov;
}
function openSheet(p){
  const ov = ensureSheet();
  const box = document.getElementById('sheetBox');
  const prices = '<div class="sprices" id="sheetPrices">' + priceRows(p.ref) + '</div>';
  const cached = descCache[p.ref];
  const descInit = (cached && cached.v) ? descHTML(cached.v) : '<span style="color:#bbb">caricamento caratteristiche tecniche\u2026</span>';
  box.innerHTML =
    '<div class="brand" id="sheetHead">' + logoIMG() + '<div class="ppword">Patek Philippe</div></div>' +
    '<h1>' + esc(p.ref) + '</h1>' +
    '<div class="scol">' + esc(p.col || '') + '</div>' +
    (p.img ? '<img class="photo" src="' + esc(bigURL(p.img)) + '">' : '') +
    (p.mat ? '<div class="smat">' + esc(p.mat) + '</div>' : '') +
    '<div class="sdesc" id="sheetDesc">' + descInit + '</div>' +
    prices +
    '<div class="ssrc">patek.com \u00B7 PP Catalogue</div>' +
    '<div class="sheet-btns">' +
      '<button class="bprint" id="btnPrintSheet" type="button">Stampa scheda</button>' +
      '<button class="bclose" id="btnCloseSheet" type="button">Chiudi</button>' +
    '</div>';
  ov.classList.add('open');
  document.body.classList.add('sheet-open');
  ov.onclick = e => { if(e.target === ov) closeSheet(); };
  const bp = document.getElementById('btnPrintSheet');
  if(bp) bp.addEventListener('click', () => window.print());
  const bc = document.getElementById('btnCloseSheet');
  if(bc) bc.addEventListener('click', closeSheet);
  (async () => {
    const refresh = () => {
      const pe = document.getElementById('sheetPrices');
      if(pe) pe.innerHTML = priceRows(p.ref);
    };
    if(!priceOf(p.ref)) await loadPrice(p.ref, p.url);
    refresh();
  })();
  if(!(cached && cached.v)){
    fetchDesc(p).then(d => {
      const el = document.getElementById('sheetDesc');
      if(!el) return;
      if(d) el.innerHTML = descHTML(d);
      else el.innerHTML = '<span style="color:#bbb">caratteristiche non disponibili</span>';
    });
  }
}

function retailLine(ref){
  return '<div class="prices" data-pp="'+esc(ref)+'">' + priceRows(ref) + '</div>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------- loader animato ----------
let countTimer = null;
function setPhase(t){ const e = document.getElementById('loadPhase'); if(e) e.textContent = t; }
function setCounts(models, cols){
  const m = document.getElementById('cModels'), c = document.getElementById('cCols');
  if(m) m.textContent = models;
  if(c) c.textContent = cols;
}
// conta verso il valore finale con effetto contachilometri
function countTo(models, cols, ms){
  clearInterval(countTimer);
  const m0 = parseInt(document.getElementById('cModels').textContent, 10) || 0;
  const c0 = parseInt(document.getElementById('cCols').textContent, 10) || 0;
  const t0 = performance.now();
  countTimer = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / (ms || 800));
    const e = 1 - Math.pow(1 - k, 3);
    setCounts(Math.round(m0 + (models - m0) * e), Math.round(c0 + (cols - c0) * e));
    if(k >= 1) clearInterval(countTimer);
  }, 40);
}
function loaderOn(){
  clearInterval(countTimer);
  setCounts(0, 0);
  setPhase('Connessione al catalogo');
  document.getElementById('loader').classList.add('on');
}
function loaderOff(){
  clearInterval(countTimer);
  document.getElementById('loader').classList.remove('on');
}

// ---------- azioni ----------
async function refresh(force){
  const status = document.getElementById('status');
  loaderOn();
  status.textContent = '';
  try{
    let usedCache = false;
    if(!force){
      const raw = lsGet(CAT_KEY);
      if(raw){
        try{
          const c = JSON.parse(raw);
          if(Date.now() - c.ts < CAT_TTL && c.items && c.items.length){
            items = c.items; usedCache = true;
            setPhase('Catalogo in memoria');
          }
        }catch(e){}
      }
    }
    if(!usedCache){
      setPhase('Lettura patek.com');
      const html = await getHTML(FINDER);
      setPhase('Analisi referenze');
      await new Promise(r => setTimeout(r, 30));   // lascia respirare l'animazione
      const parsed = parseCatalog(html);
      if(!parsed.length) throw new Error('catalogo non leggibile');
      items = parsed;
      lsSet(CAT_KEY, JSON.stringify({ts: Date.now(), items}));
    }
    const nCols = new Set(items.map(p => p.col)).size;
    setPhase(usedCache ? 'Catalogo pronto' : 'Catalogo aggiornato');
    countTo(items.length, nCols, 900);
    await new Promise(r => setTimeout(r, 1000));
    snapshot = (() => { try{ const r = lsGet(SNAP_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } })();
    computeAdded();
    document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    status.innerHTML = '<span class="hl">'+items.length+'</span> modelli a catalogo · ' +
      new Set(items.map(p=>p.col)).size + ' collezioni' + (usedCache ? ' · cache' : '');
    renderNews();
    render();
    // segna automaticamente come visto: la prossima lettura mostrerà solo le referenze davvero nuove
    snapshot = { ts: Date.now(), ids: items.map(p => p.id) };
    lsSet(SNAP_KEY, JSON.stringify(snapshot));
  }catch(e){
    setPhase('Lettura non riuscita');
    status.innerHTML = 'Impossibile leggere il catalogo ('+esc(e.message)+'). Riprova con Aggiorna — e ricorda che nell\'anteprima di Claude le connessioni esterne sono bloccate.';
  }finally{
    loaderOff();
  }
}

document.getElementById('btnRefresh').onclick = () => refresh(true);
const chfBox = document.getElementById('chfBox');
document.getElementById('btnChf').onclick = () => { chfBox.classList.toggle('on'); chfInfo(); };
document.getElementById('chfClose').onclick = () => chfBox.classList.remove('on');
document.getElementById('chfSave').onclick = () => {

  document.getElementById('chfInfo').textContent = r.msg;
  if(r.ok){ document.getElementById('chfText').value = ''; render(); }
};
document.getElementById('chfClear').onclick = () => {
  chfList = {};
  try{ localStorage.removeItem(CHF_KEY); }catch(e){}
  chfInfo(); render();
};
document.getElementById('search').addEventListener('input', render);

loadChfRepo();
refresh();
})();
